# DD-13 ビルドとデプロイ（FR-13、CC-06）／DD-16 セキュリティ設計（NFR-12、NFR-13）
# 外部の Action はコミット SHA で固定し、横にバージョンを書く。更新は Dependabot が PR を作る。
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # TC-N06 で全コミットの作者を確かめるため
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit dependencies (TC-N09)
        run: npm audit --audit-level=high
      - name: Check workflow hardening (TC-N10)
        run: npm run check:workflows
      - name: Check image metadata (TC-N15)
        run: npm run check:images
      - name: Check privacy (TC-N06)
        run: npm run check:privacy
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - name: Type check
        run: npm run lint
      - name: Dependency rules (TC-A01)
        run: npm run depcruise
      - name: Unit / integration / architecture tests
        run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (includes content schema validation)
        run: npm run build
      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium
      - name: System tests (TC-S, TC-N02〜N05, N11〜N14)
        run: npm run test:e2e
      - name: Lighthouse (TC-N01)
        run: npm run test:lighthouse
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
