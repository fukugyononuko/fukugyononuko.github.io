# DD-16（NFR-13）：依存パッケージと Action の更新を受け取る
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      # astro は @astrojs/markdown-satteri を版で固定している。こちらも同じ版に固定しているので、必ず同時に上げる（DD-11、#39）
      astro:
        patterns: ["astro", "@astrojs/markdown-satteri"]
    ignore:
      # @astrojs/check の peerDependencies が typescript ^5 || ^6 のため。対応したら外す。
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
