# DD-16（NFR-13）：依存パッケージと Action の更新を受け取る
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      # astro は @astrojs/markdown-satteri を版で固定していて、こちらも同じ版に固定している。satteri も直接使う（DD-11、#39）。
      # 両方に新しい版があれば 1 つの PR にまとめる。グループは同時の更新を保証しないので、版がずれた PR は TC-A02 で失敗させる
      astro:
        patterns: ["astro", "@astrojs/markdown-satteri", "satteri"]
    ignore:
      # @astrojs/check の peerDependencies が typescript ^5 || ^6 のため。対応したら外す。
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
